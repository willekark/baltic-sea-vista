# Ecological Scoring Configuration v1.0
# Transparent, configurable scoring model for Baltic Sea ecological health

metadata:
  version: "1.0"
  updated: "2025-08-30"
  timezone: "Europe/Stockholm"
  description: "Comprehensive ecological scoring for Baltic Sea municipalities and business sites"

# Five equal-weight pillars (customizable)
pillars:
  eutrophication_pressure:
    weight: 0.2
    description: "Nutrient pollution and water clarity impacts"
  ecosystem_health:
    weight: 0.2  
    description: "Oxygen levels, HAB risk, and biodiversity protection"
  bathing_wastewater:
    weight: 0.2
    description: "Bathing water quality and wastewater treatment compliance"
  coastal_hazard:
    weight: 0.2
    description: "Resilience to sea level rise and storm surge"
  trend_compliance:
    weight: 0.2
    description: "Multi-year trends and participation in sustainability frameworks"

# Metric definitions and transformations
metrics:
  # Eutrophication Pressure Pillar
  chl_a_anomaly:
    pillar: "eutrophication_pressure"
    source: "cmems.bgc.chla"
    transform: "zscore_to_0_100"
    description: "Chlorophyll-a z-score vs 2000-2020 climatology"
    basin_overrides: true
    weight_in_pillar: 0.4
    
  secchi_anomaly:
    pillar: "eutrophication_pressure"
    source: "derived.secchi"
    transform: "zscore_to_0_100" 
    description: "Water clarity anomaly (derived from TSM/turbidity)"
    weight_in_pillar: 0.3
    
  nutrient_proxy:
    pillar: "eutrophication_pressure"
    source: "cmems.bgc.nutrients"
    transform: "zscore_to_0_100"
    description: "Combined N/P anomaly indicator"
    weight_in_pillar: 0.3

  # Ecosystem Health Pillar  
  do_hypoxia_days:
    pillar: "ecosystem_health"
    source: "derived.hypoxia_days_per_quarter"
    transform: "lower_is_better_minmax"
    min: 0
    max: 30
    description: "Days with DO < 4 mg/L per quarter"
    weight_in_pillar: 0.4
    
  hab_prob_summer:
    pillar: "ecosystem_health"
    source: "derived.hab_probability_jja"
    transform: "lower_is_better_minmax"
    min: 0.0
    max: 1.0
    description: "Harmful algal bloom probability (June-August mean)"
    weight_in_pillar: 0.3
    
  shoreline_in_mpa_pct:
    pillar: "ecosystem_health"
    source: "emodnet.mpa_overlap_pct"
    transform: "higher_is_better_minmax"
    min: 0
    max: 60
    description: "Percentage of shoreline within or adjacent to Marine Protected Areas"
    weight_in_pillar: 0.3

  # Bathing & Wastewater Pillar
  bathing_excellent_pct:
    pillar: "bathing_wastewater"
    source: "eea.bathing.excellent_pct"
    transform: "higher_is_better_minmax"
    min: 0
    max: 100
    description: "Percentage of bathing sites rated 'Excellent' by EEA"
    weight_in_pillar: 0.4
    
  uwwtd_compliance:
    pillar: "bathing_wastewater"
    source: "uwwtd.city_compliance_pct"
    transform: "higher_is_better_minmax"
    min: 0
    max: 100
    description: "UWWTD compliance rate for municipal treatment plants"
    weight_in_pillar: 0.3
    
  tertiary_np_flag:
    pillar: "bathing_wastewater"
    source: "uwwtd.tertiary_np"
    transform: "boolean_100_or_0"
    description: "Presence of tertiary N/P removal in major treatment plants"
    weight_in_pillar: 0.3

  # Coastal Hazard Pillar
  surge_exceedance_72h:
    pillar: "coastal_hazard"
    source: "derived.surge_exceedance_probability"
    transform: "lower_is_better_minmax"
    min: 0.0
    max: 1.0
    description: "72-hour storm surge exceedance probability"
    weight_in_pillar: 0.6
    
  has_adaptation_plan:
    pillar: "coastal_hazard"
    source: "admin.flags.adaptation_plan"
    transform: "boolean_100_or_0"
    description: "Municipal climate adaptation/resilience plan in place"
    weight_in_pillar: 0.4

  # Trend & Compliance Pillar
  helcom_trend_3y:
    pillar: "trend_compliance"
    source: "derived.helcom_indicator_trend"
    transform: "trend_to_score"
    description: "3-year trend in HELCOM core indicators"
    weight_in_pillar: 0.6
    
  frameworks_participation:
    pillar: "trend_compliance"
    source: "admin.flags.{cdp,secap,gca,iso37120}"
    transform: "sum_boolean_average"
    description: "Participation in CDP, SECAP, Green City Accord, ISO 37120"
    weight_in_pillar: 0.4

# Transform function parameters
transforms:
  zscore_to_0_100:
    description: "Convert z-score to 0-100, where 0 = worst anomaly, 100 = best"
    formula: "max(0, min(100, 50 - 25 * zscore))"
    
  lower_is_better_minmax:
    description: "Linear scale where lower values = higher scores"
    formula: "100 * (max - value) / (max - min)"
    
  higher_is_better_minmax:
    description: "Linear scale where higher values = higher scores"  
    formula: "100 * (value - min) / (max - min)"
    
  boolean_100_or_0:
    description: "Boolean flag: true = 100, false = 0"
    
  trend_to_score:
    description: "Map 3-year trend to score"
    mapping:
      "improving": 100
      "stable": 70
      "declining": 30
      "unknown": 50
      
  sum_boolean_average:
    description: "Average of multiple boolean flags * 100"

# Basin-specific adjustments (optional)
basin_adjustments:
  bothnian_bay:
    chl_a_anomaly:
      baseline_offset: 0.1  # Naturally lower productivity
  kattegat:
    hab_prob_summer:
      severity_multiplier: 1.2  # Higher HAB risk in transition zone
      
# Quality flags and confidence scoring
confidence_rules:
  data_age_days:
    excellent: 7
    good: 30
    poor: 90
  spatial_coverage:
    excellent: 0.8  # 80% of area covered
    good: 0.6
    poor: 0.3
  temporal_coverage:
    excellent: 0.9  # 90% of time period
    good: 0.7
    poor: 0.5