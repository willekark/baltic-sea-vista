<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Chrome metallic gradient -->
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="25%" style="stop-color:#e2e8f0"/>
      <stop offset="50%" style="stop-color:#cbd5e1"/>
      <stop offset="75%" style="stop-color:#94a3b8"/>
      <stop offset="100%" style="stop-color:#64748b"/>
    </linearGradient>
    
    <!-- Subtle glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  
  <!-- Dark background -->
  <rect width="800" height="200" fill="#1a1a1a"/>
  
  <!-- Maritime wave symbol positioned next to text -->
  <g transform="translate(100, 100)">
    <!-- Stylized wave -->
    <g fill="url(#chrome)" filter="url(#glow)">
      <!-- Main wave form -->
      <path d="M-30 0 Q-15 -12 0 0 Q15 12 30 0 Q45 -8 60 0" 
            stroke="url(#chrome)" 
            stroke-width="3" 
            fill="none" 
            stroke-linecap="round"/>
      
      <!-- Secondary wave layer -->
      <path d="M-25 8 Q-10 -4 5 8 Q20 20 35 8" 
            stroke="url(#chrome)" 
            stroke-width="2" 
            fill="none" 
            opacity="0.7" 
            stroke-linecap="round"/>
      
      <!-- Wave crest points -->
      <circle cx="0" cy="0" r="2.5" fill="url(#chrome)"/>
      <circle cx="30" cy="0" r="2.5" fill="url(#chrome)"/>
      <circle cx="60" cy="0" r="2" fill="url(#chrome)"/>
    </g>
  </g>
  
  <!-- Typography - BlackShell style with full company name -->
  <text x="200" y="115" 
        font-family="Helvetica Neue, Arial, sans-serif" 
        font-size="42" 
        font-weight="300" 
        fill="url(#chrome)" 
        letter-spacing="2px">Baltic Intelligence</text>
</svg>