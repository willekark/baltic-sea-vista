<svg width="200" height="50" viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Chrome metallic gradient -->
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="25%" style="stop-color:#e2e8f0"/>
      <stop offset="50%" style="stop-color:#cbd5e1"/>
      <stop offset="75%" style="stop-color:#94a3b8"/>
      <stop offset="100%" style="stop-color:#64748b"/>
    </linearGradient>
    
    <!-- Subtle glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
  </defs>
  
  <!-- Maritime wave symbol positioned next to text -->
  <g transform="translate(25, 25)">
    <!-- Stylized wave -->
    <g fill="url(#chrome)" filter="url(#glow)">
      <!-- Main wave form -->
      <path d="M-7.5 0 Q-3.75 -3 0 0 Q3.75 3 7.5 0 Q11.25 -2 15 0" 
            stroke="url(#chrome)" 
            stroke-width="1.5" 
            fill="none" 
            stroke-linecap="round"/>
      
      <!-- Secondary wave layer -->
      <path d="M-6.25 2 Q-2.5 -1 1.25 2 Q5 5 8.75 2" 
            stroke="url(#chrome)" 
            stroke-width="1" 
            fill="none" 
            opacity="0.7" 
            stroke-linecap="round"/>
      
      <!-- Wave crest points -->
      <circle cx="0" cy="0" r="0.6" fill="url(#chrome)"/>
      <circle cx="7.5" cy="0" r="0.6" fill="url(#chrome)"/>
      <circle cx="15" cy="0" r="0.5" fill="url(#chrome)"/>
    </g>
  </g>
  
  <!-- Typography - BlackShell style with full company name -->
  <text x="50" y="30" 
        font-family="Helvetica Neue, Arial, sans-serif" 
        font-size="12" 
        font-weight="300" 
        fill="url(#chrome)" 
        letter-spacing="1px">Baltic Intelligence</text>
</svg>